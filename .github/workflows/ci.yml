# =============================================================================
# CI Workflow Template for ESP-IDF Component
# =============================================================================
# To enable: rename this file from ci.yml.disabled to ci.yml
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          cmake -S test/host -B test/host/build
          cmake --build test/host/build
          test/host/build/host_test

  build-example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        idf_version:
          - "v5.4"
        target:
          - esp32s3
    container:
      image: espressif/idf:${{ matrix.idf_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build example
        working-directory: examples/basic
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target ${{ matrix.target }}
          idf.py build

  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        idf_version:
          - "v5.4"
    container:
      image: espressif/idf:${{ matrix.idf_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build test
        working-directory: test
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

  # Uncomment to enable on-target testing with pytest (requires self-hosted runner)
